name: Build CleanBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias cleanbot -keyalg RSA -keysize 2048 -validity 10000 -storepass cleanbot123 -keypass cleanbot123 -dname "CN=CleanBot, OU=Engineering, O=CleanBot, L=Paris, ST=IDF, C=FR"

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace

    - name: Rename APK
      run: cp app/build/outputs/apk/release/app-release.apk CleanBot_Pro.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanBot-Pro-Release
        path: CleanBot_Pro.apk

    - name: Create Release & Upload APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.2
        name: "CleanBot Pro v1.2 (Channel 1 Direct RFCOMM)"
        body: "CleanBot Pro v1.2: Direct Channel 1 RFCOMM connection bypasses SDP query timeouts on clone HC-05 chips."
        files: CleanBot_Pro.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
